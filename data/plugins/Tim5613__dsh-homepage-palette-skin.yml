url: https://github.com/Tim5613/dsh-homepage-palette-skin
name: Tim5613/dsh-homepage-palette-skin
category: theme
description:
  en: Repaints the DSH sidebar as a fixed deep-blue gradient panel with light text, using colours sampled from the official homepage, and adds a settings row that gives the light-mode content area either a low-glare tint or that homepage's slowly drifting blue background.
  zh: 把 DSH 侧边栏改为固定深蓝渐变面板并配浅色文字（配色取自官网逐像素采样），并在设置里加一行：浅色模式的内容区可选低眩光底色，或铺上官网首页那层缓慢流动的蓝色背景。